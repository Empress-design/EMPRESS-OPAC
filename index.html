
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSTVET Online Public Access Catalogue</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9;color:#222}
header{background:#17365d;color:white;text-align:center;padding:28px 15px}
header h1{margin:0 0 10px}
header p{margin:5px}
main{max-width:1000px;margin:25px auto;padding:15px}
.search{display:flex;gap:8px;margin-bottom:20px}
input,select{padding:12px;border:1px solid #bbb;border-radius:6px;font-size:16px}
input{flex:1;min-width:0}
select{width:100%;margin-bottom:18px}
#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.book{background:white;border-radius:9px;padding:18px;border:1px solid #ddd;box-shadow:0 2px 5px #ddd}
.book h3{color:#17365d;margin-top:0}
.book p{line-height:1.5;margin:7px 0}
.tag{display:inline-block;background:#e4edf8;padding:5px 8px;border-radius:5px;font-size:13px}
footer{text-align:center;background:#17365d;color:white;padding:18px;margin-top:30px}
button{padding:12px 18px;background:#c99a2e;color:#111;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>KSTVET Library OPAC</h1>
<p>Kenya School of TVET</p>
<p>Online Public Access Catalogue — Book Search</p>
</header>
<main>
<h2>Search the Library Catalogue</h2>
<p>Search by book title, author, subject or publisher.</p>
<div class="search">
<input id="query" type="search" placeholder="Enter title, author or subject...">
<button onclick="searchBooks()">Search</button>
</div>
<select id="subject" onchange="searchBooks()">
<option value="">All subjects</option>
<option value="Library and Information Science">Library and Information Science</option>
<option value="Research">Research</option>
<option value="Education">Education</option>
<option value="Computing">Computing</option>
<option value="Management">Management</option>
</select>
<p id="count" aria-live="polite"></p>
<div id="results"></div>
</main>
<footer>
<p>KSTVET Library OPAC | Student Demonstration Project</p>
<p>Catalogue sample for learning purposes. Verify holdings with the library.</p>
</footer>
<script>
const books = [
{title:"Introduction to Modern Information Retrieval",author:"G. G. Chowdhury",publisher:"Facet Publishing",year:2010,subject:"Library and Information Science"},
{title:"Foundations of Library and Information Science",author:"Richard E. Rubin",publisher:"ALA Neal-Schuman",year:2016,subject:"Library and Information Science"},
{title:"The Organization of Information",author:"Arlene G. Taylor and Daniel N. Joudrey",publisher:"Libraries Unlimited",year:2009,subject:"Library and Information Science"},
{title:"Cataloguing and Classification: An Introduction",author:"Lois Mai Chan",publisher:"McGraw-Hill",year:1994,subject:"Library and Information Science"},
{title:"Research Methods in Education",author:"Louis Cohen, Lawrence Manion and Keith Morrison",publisher:"Routledge",year:2018,subject:"Research"},
{title:"Research Design",author:"John W. Creswell and J. David Creswell",publisher:"SAGE Publications",year:2018,subject:"Research"},
{title:"Educational Psychology",author:"Anita Woolfolk",publisher:"Pearson",year:2016,subject:"Education"},
{title:"Learning Web Design",author:"Jennifer Niederst Robbins",publisher:"O'Reilly Media",year:2018,subject:"Computing"},
{title:"Management",author:"Stephen P. Robbins and Mary Coulter",publisher:"Pearson",year:2018,subject:"Management"},
{title:"Information Literacy Instruction",author:"Esther S. Grassian and Joan R. Kaplowitz",publisher:"Neal-Schuman Publishers",year:2009,subject:"Library and Information Science"}
];
function searchBooks(){
const q=document.getElementById("query").value.toLowerCase().trim();
const s=document.getElementById("subject").value;
const matches=books.filter(b=>
(!s||b.subject===s)&&
[b.title,b.author,b.publisher,b.subject,String(b.year)].join(" ").toLowerCase().includes(q)
);
document.getElementById("count").textContent=matches.length+" book(s) found";
document.getElementById("results").innerHTML=matches.map(b=>
`<article class="book"><span class="tag">${b.subject}</span><h3>${b.title}</h3><p><strong>Author:</strong> ${b.author}</p><p><strong>Publisher:</strong> ${b.publisher}</p><p><strong>Year:</strong> ${b.year}</p><p><strong>Subject:</strong> ${b.subject}</p></article>`
).join("")||"<p>No matching books found. Try another search.</p>";
}
searchBooks();
</script>
</body>
</html>
